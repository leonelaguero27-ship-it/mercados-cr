<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercados CR</title>
<meta name="theme-color" content="#0B5D3B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap">
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#1B1F1D; --muted:#5F6B66; --line:#DDE3E0;
  --brand:#0B5D3B; --brand-ink:#FFFFFF; --up:#137333; --up-soft:#E6F4EA; --down:#C5221F; --down-soft:#FCE8E6;
  --f:"Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101614; --card:#18201D; --ink:#E7ECEA; --muted:#9AA8A2; --line:#2A3430;
  --brand:#2E9D6B; --brand-ink:#FFFFFF; --up:#81C995; --up-soft:#1C3325; --down:#F28B82; --down-soft:#3B1E1C; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4}
body{padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) calc(160px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
#refresh{width:100%;min-height:58px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);font:600 17px var(--f);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
#refresh:disabled{opacity:.75}
#refresh svg{width:22px;height:22px}
#refresh.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#stamp{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.card{background:var(--card);border-radius:16px;padding:14px 16px}
.err{background:var(--down-soft);color:var(--down);border-radius:12px;padding:12px 14px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
/* Tipo de cambio */
.conv{display:flex;align-items:center;gap:10px}
.conv label{font-size:13px;color:var(--muted);flex:none}
.conv .box{flex:1;min-width:0;display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);min-height:50px}
.conv .box span{font-weight:700;color:var(--muted)}
.conv input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:700 22px var(--f);padding:8px 6px;outline:none}
.fx{display:flex;flex-direction:column;gap:10px}
.ent h3{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ordbtn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px var(--f);border-radius:12px;min-height:50px;padding:0 12px;cursor:pointer}
.ordbtn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mv{display:flex;gap:6px;flex:none}
.mv button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 18px var(--f);cursor:pointer}
.mv button:disabled{opacity:.3}
.ent.ordering h3{align-items:center;margin:0}
.ent h3 small{font-size:11.5px;color:var(--muted);font-weight:500;text-align:right}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rate{border-radius:12px;background:var(--bg);padding:10px 12px}
.rate .k{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.rate .v{font-size:24px;font-weight:700}
.rate .x{font-size:13px;color:var(--muted);margin-top:4px}
.rate .x b{color:var(--ink);font-weight:700}
.dl{font-size:12.5px;font-weight:600;margin-top:2px}
.ent .eh{cursor:pointer;border-radius:8px}
.ent .eh .chev{color:var(--muted);font-size:13px;font-weight:500;margin-left:6px}
.hist{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.hist .hplot{width:100%;height:170px}
.hist table{width:100%;border-collapse:collapse;font-size:13.5px}
.hist td,.hist th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:500;font-size:12px}
.hist td:first-child,.hist th:first-child{text-align:left}
.hist .note{font-size:12px;color:var(--muted);margin-top:6px}
.best{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--up-soft);color:var(--up);margin-left:4px;vertical-align:2px}
/* S&P */
.hero h2{margin:0;font-size:15px;font-weight:500;color:var(--muted)}
.hero .p{font-size:38px;font-weight:700;line-height:1.1;margin-top:4px}
.hero .p span{font-size:16px;font-weight:500;color:var(--muted)}
.chg{font-size:16px;font-weight:600;margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)}
.ranges{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:4px 0 6px}
.ranges button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f);min-height:40px;border-radius:10px;cursor:pointer}
.ranges button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
#plot{width:100%;height:260px}
.pchg{font-size:14px;font-weight:600;margin:2px 2px 4px}
.pchg small{color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:14px;padding:12px 14px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;margin-top:2px}
/* navegación inferior */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.dockbtn{max-width:560px;margin:0 auto}
nav{display:grid;grid-template-columns:1fr 1fr;max-width:560px;margin:4px auto 0}
nav button{border:0;background:none;color:var(--muted);font:600 12.5px var(--f);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:12px}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--brand)}
nav button[aria-current="page"] svg{background:var(--up-soft);border-radius:999px;padding:2px 14px;width:52px;box-sizing:content-box}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.conv input:focus,.conv input:focus-visible{outline:none}
.conv .box:focus-within{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#refresh.busy svg{animation:none}}
</style>
</head>
<body>
<main>
  <div id="stamp" aria-live="polite"></div>

  <section id="v-fx" aria-label="Tipo de Cambio CR">
    <div class="card conv">
      <label for="usd">Monto</label>
      <div class="box"><span>$</span><input id="usd" type="number" inputmode="decimal" min="0" step="any" value="1" aria-label="Monto en dólares"></div>
      <button id="ord" class="ordbtn" type="button" aria-pressed="false">↕ Ordenar</button>
    </div>
    <div id="fx" class="fx" style="margin-top:10px"></div>
  </section>

  <section id="v-spx" aria-label="S&P 500" hidden>
    <div id="spx"></div>
  </section>
</main>

<div class="dock">
  <div class="dockbtn"><button id="refresh" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span>Actualizar / Consultar datos</span></button></div>
<nav aria-label="Vistas">
  <button data-v="fx" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>Tipo de Cambio CR</button>
  <button data-v="spx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>S&amp;P 500</button>
</nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.3/plotly-basic.min.js" defer></script>
<script>
const TZ = "America/Costa_Rica";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const crc = new Intl.NumberFormat("es-CR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const colones = (v) => "₡" + crc.format(v);

let FX = null, SPX = null, stamp = "", view = "fx", range = "1D", busy = false;

// ---------- hora CST ----------
function horaCR(d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true })
    .formatToParts(d).map((x) => [x.type, x.value]));
  return `${p.hour}:${p.minute}:${p.second} ${p.dayPeriod === "PM" ? "p. m." : "a. m."}`;
}
function fechaCR(ms) { // "YYYY-MM-DD HH:MM:SS" en hora de Costa Rica, para el eje del gráfico
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false })
    .formatToParts(new Date(ms)).map((x) => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day} ${p.hour === "24" ? "00" : p.hour}:${p.minute}:${p.second}`;
}

// ---------- consulta (solo al tocar el botón, y una vez al abrir) ----------
async function getJSON(url) {
  try {
    const r = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(30000) });
    if (!r.ok) return { ok: false, error: `El servidor respondió ${r.status}` };
    return await r.json();
  } catch (e) {
    return { ok: false, error: e && e.name === "TimeoutError" ? "La consulta tardó demasiado. Revisa tu conexión e intenta de nuevo." : "Sin conexión. Revisa tu internet e intenta de nuevo." };
  }
}
async function actualizar() {
  if (busy) return;
  busy = true; const b = $("#refresh"); b.disabled = true; b.classList.add("busy"); b.querySelector("span").textContent = "Consultando…";
  const [fx, spx] = await Promise.all([getJSON("/api/fx"), getJSON("/api/spx")]);
  FX = fx; SPX = spx; stamp = `Última actualización: ${horaCR()} CST (UTC-6)`;
  try { localStorage.setItem("mercados-cr", JSON.stringify({ FX, SPX, stamp })); } catch (e) {}
  if (FX && FX.ok) guardarHist(FX);
  busy = false; b.disabled = false; b.classList.remove("busy"); b.querySelector("span").textContent = "Actualizar / Consultar datos";
  render();
}

// ---------- historial por entidad (se guarda en este teléfono cada vez que actualizas) ----------
const HKEY = "fx-historial";
function hist() { try { return JSON.parse(localStorage.getItem(HKEY) || "{}"); } catch (e) { return {}; } }
function guardarHist(fx) {
  const H = hist(), now = Date.now();
  fx.entidades.filter((e) => e.ok).forEach((e) => {
    const l = (H[e.id] = H[e.id] || []), last = l[l.length - 1];
    if (last && last.c === e.compra && last.v === e.venta) last.u = now;          // sin cambio: solo se anota que se revisó
    else l.push({ t: now, c: e.compra, v: e.venta });
    if (l.length > 400) l.splice(0, l.length - 400);
  });
  try { localStorage.setItem(HKEY, JSON.stringify(H)); } catch (e) {}
}
function previo(id, e) {   // la lectura anterior con valores distintos a los de ahora
  const l = hist()[id] || [];
  for (let i = l.length - 1; i >= 0; i--) if (l[i].c !== e.compra || l[i].v !== e.venta) return l[i];
  return null;
}
const crcD = new Intl.NumberFormat("es-CR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function delta(now, before) {
  if (before == null) return "";
  const d = Math.round((now - before) * 100) / 100;
  if (!d) return `<div class="dl" style="color:var(--muted)">= sin cambio</div>`;
  return `<div class="dl num ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ₡${crcD.format(Math.abs(d))}</div>`;
}
const fechaCorta = (ms) => { const [d, h] = fechaCR(ms).split(" "), [y, mo, dd] = d.split("-"), [H, M] = h.split(":");
  return `${+dd} ${MESES[+mo - 1]}${y !== String(new Date().getFullYear()) ? " " + y : ""}, ${String((+H % 12) || 12).padStart(2, "0")}:${M} ${+H < 12 ? "a. m." : "p. m."}`; };
const abiertas = new Set();
function histHTML(e) {
  const l = hist()[e.id] || [];
  if (!l.length) return `<div class="hist"><div class="note">Todavía no hay historial: se guarda cada vez que tocas «Actualizar / Consultar datos».</div></div>`;
  const rows = l.slice().reverse().slice(0, 20).map((x, i, arr) => {
    const p = arr[i + 1], dc = p ? x.c - p.c : 0, dv = p ? x.v - p.v : 0;
    const ar = (d) => !p || !d ? "" : ` <span class="${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"}</span>`;
    return `<tr><td>${fechaCorta(x.t)}</td><td class="num">${crcD.format(x.c)}${ar(dc)}</td><td class="num">${crcD.format(x.v)}${ar(dv)}</td></tr>`;
  }).join("");
  const first = l[0];
  return `<div class="hist">${l.length > 1 ? `<div class="hplot" id="hp_${e.id}"></div>` : ""}
    <table><tr><th>Cuando cambió</th><th>Compra</th><th>Venta</th></tr>${rows}</table>
    <div class="note">Desde ${fechaCorta(first.t)} · ${l.length} cambio${l.length === 1 ? "" : "s"} registrados en este teléfono.</div></div>`;
}
function histPlot(e) {
  const el = document.getElementById("hp_" + e.id), l = hist()[e.id] || [];
  if (!el || l.length < 2) return;
  if (!window.Plotly) { setTimeout(() => histPlot(e), 400); return; }
  regES();
  const css = getComputedStyle(document.documentElement), ink = css.getPropertyValue("--muted").trim(), grid = css.getPropertyValue("--line").trim();
  const pts = l.flatMap((x) => [x, ...(x.u ? [{ ...x, t: x.u }] : [])]);   // escalones: el valor se mantiene hasta que cambia
  const xs = pts.map((x) => fechaCR(x.t)), lab = pts.map((x) => fechaCorta(x.t));
  const tr = (k, name, color) => ({ x: xs, y: pts.map((x) => x[k]), name, type: "scatter", mode: "lines+markers", line: { shape: "hv", color, width: 2 }, marker: { size: 5 },
    customdata: lab, hovertemplate: `%{customdata}<br>${name}: <b>₡%{y:,.2f}</b><extra></extra>` });
  Plotly.react(el, [tr("v", "Venta", css.getPropertyValue("--down").trim()), tr("c", "Compra", css.getPropertyValue("--up").trim())], {
    margin: { l: 44, r: 8, t: 4, b: 24 }, paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", font: { family: "Roboto Flex, Roboto, sans-serif", color: ink, size: 11 },
    showlegend: true, legend: { orientation: "h", y: 1.12, x: 0 }, hovermode: "closest", dragmode: false,
    xaxis: { showgrid: false, nticks: 4, fixedrange: true, tickformat: "%d %b" }, yaxis: { gridcolor: grid, tickformat: ",.0f", nticks: 4, fixedrange: true },
  }, { displayModeBar: false, responsive: true, locale: "es" });
}

// ---------- vista: tipo de cambio ----------
let ordenando = false;
function orden() { try { return JSON.parse(localStorage.getItem("fx-orden") || "[]"); } catch (e) { return []; } }
function ordenadas(ents) { const o = orden(); const pos = (id) => { const i = o.indexOf(id); return i < 0 ? 99 : i; }; return [...ents].sort((a, b) => pos(a.id) - pos(b.id)); }
function mover(id, d) {
  const ids = ordenadas(FX.entidades).map((e) => e.id), i = ids.indexOf(id), j = i + d;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  try { localStorage.setItem("fx-orden", JSON.stringify(ids)); } catch (e) {}
  renderFX();
}
function renderFX() {
  const box = $("#fx");
  if (!FX) { box.innerHTML = `<div class="card empty">Toca «Actualizar / Consultar datos».</div>`; return; }
  if (!FX.ok) { box.innerHTML = `<div class="err">No se pudo leer el tipo de cambio del BCCR: ${esc(FX.error)}</div>`; return; }
  const m = Math.max(0, parseFloat($("#usd").value) || 0), mt = usd.format(m);
  const ok = FX.entidades.filter((e) => e.ok);
  const bestCompra = Math.max(...ok.map((e) => e.compra)), bestVenta = Math.min(...ok.map((e) => e.venta));
  const lista = ordenadas(FX.entidades);
  if (ordenando) {
    box.innerHTML = lista.map((e, i) => `<div class="card ent ordering"><h3>${esc(e.nombre)}<span class="mv">
      <button data-mv="${e.id}" data-d="-1" aria-label="Subir ${esc(e.nombre)}" ${i === 0 ? "disabled" : ""}>↑</button>
      <button data-mv="${e.id}" data-d="1" aria-label="Bajar ${esc(e.nombre)}" ${i === lista.length - 1 ? "disabled" : ""}>↓</button></span></h3></div>`).join("");
    return;
  }
  box.innerHTML = lista.map((e) => !e.ok
    ? `<div class="card ent"><h3>${esc(e.nombre)}</h3><div class="err">${esc(e.error)}</div></div>`
    : (() => { const p = previo(e.id, e), op = abiertas.has(e.id); return `<div class="card ent">
      <h3 class="eh" data-hist="${e.id}" role="button" tabindex="0" aria-expanded="${op}" aria-label="Historial de ${esc(e.nombre)}">${esc(e.nombre)}<span class="chev">${op ? "▴ ocultar" : "historial ▾"}</span>${e.actualizado ? `<small>${esc(e.actualizado)}</small>` : ""}</h3>
      <div class="rates">
        <div class="rate"><div class="k">COMPRA${ok.length > 1 && e.compra === bestCompra ? `<span class="best">MEJOR</span>` : ""}</div><div class="v num">${colones(e.compra)}</div>${p ? delta(e.compra, p.c) : ""}
          <div class="x">Vendes $${mt}:<br><b class="num">${colones(m * e.compra)}</b></div></div>
        <div class="rate"><div class="k">VENTA${ok.length > 1 && e.venta === bestVenta ? `<span class="best">MEJOR</span>` : ""}</div><div class="v num">${colones(e.venta)}</div>${p ? delta(e.venta, p.v) : ""}
          <div class="x">Compras $${mt}:<br><b class="num">${colones(m * e.venta)}</b></div></div>
      </div>${p ? `<div class="note mu" style="font-size:12px;color:var(--muted);margin-top:6px">Comparado con ${fechaCorta(p.u || p.t)}</div>` : ""}${op ? histHTML(e) : ""}</div>`; })()).join("");
  lista.filter((e) => e.ok && abiertas.has(e.id)).forEach(histPlot);
}

// ---------- vista: S&P 500 ----------
function renderSPX() {
  const box = $("#spx");
  if (!SPX) { box.innerHTML = `<div class="card empty">Toca «Actualizar / Consultar datos».</div>`; return; }
  if (!SPX.ok) { box.innerHTML = `<div class="err">No se pudo consultar el S&amp;P 500: ${esc(SPX.error)}</div>`; return; }
  const q = SPX.quote, up = (q.cambio ?? 0) >= 0, sg = up ? "+" : "−";
  const f = (v) => v == null ? "—" : usd.format(v);
  box.innerHTML = `
  <div class="card hero">
    <h2>S&amp;P 500 (.INX)</h2>
    <div class="p num">${f(q.precio)} <span>USD</span></div>
    <div class="chg num ${up ? "up" : "down"}">${q.cambio == null ? "" : `${sg}${f(Math.abs(q.cambio))} (${sg}${Math.abs(q.pct).toFixed(2)}%) hoy`}</div>
    <div class="ranges" role="group" aria-label="Temporalidad">${["1D", "5D", "1M", "6M", "1Y", "5Y"].map((r) => `<button data-r="${r}" aria-pressed="${r === range}">${r}</button>`).join("")}</div>
    <div id="pchg" class="pchg num"></div>
    <div id="plot"></div>
  </div>
  <div class="kpis" style="margin-top:10px">
    <div class="kpi"><div class="k">Cierre anterior</div><div class="v num">${f(q.cierreAnterior)}</div></div>
    <div class="kpi"><div class="k">Apertura hoy</div><div class="v num">${f(q.apertura)}</div></div>
    <div class="kpi"><div class="k">Mínimo del día</div><div class="v num">${f(q.minimo)}</div></div>
    <div class="kpi"><div class="k">Máximo del día</div><div class="v num">${f(q.maximo)}</div></div>
  </div>`;
  plot();
}
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "set", "oct", "nov", "dic"];
function etiqueta(ms, conHora) {
  const [d, h] = fechaCR(ms).split(" "), [y, mo, dd] = d.split("-");
  let txt = `${+dd} ${MESES[+mo - 1]} ${y}`;
  if (conHora) { const [H, M] = h.split(":"); const hh = (+H % 12) || 12; txt += `, ${String(hh).padStart(2, "0")}:${M} ${+H < 12 ? "a. m." : "p. m."} CST`; }
  return txt;
}
let localeOk = false;
function regES() {
  if (!localeOk) { Plotly.register({ moduleType: "locale", name: "es", dictionary: {}, format: { months: ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"], shortMonths: MESES, days: ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"], shortDays: ["dom","lun","mar","mié","jue","vie","sáb"], periods: ["a. m.", "p. m."] } }); localeOk = true; }
}
function plot() {
  const el = $("#plot"); if (!el) return;
  const s = SPX.series[range];
  if (!s || s.error || !s.c || !s.c.length) { el.innerHTML = `<div class="empty">${esc((s && s.error) || "Sin datos para este periodo")}</div>`; return; }
  if (!window.Plotly) { el.innerHTML = `<div class="empty">Cargando gráfico…</div>`; setTimeout(plot, 400); return; }
  regES();
  const base = range === "1D" && s.base ? s.base : s.c[0];
  const up = s.c[s.c.length - 1] >= base;
  const pct = (v) => ((v - base) / base) * 100, sgn = (v) => (v >= 0 ? "+" : "−");
  const fin = s.c[s.c.length - 1], pf = pct(fin);
  const nomb = { "1D": "Hoy", "5D": "5 días", "1M": "1 mes", "6M": "6 meses", "1Y": "1 año", "5Y": "5 años" }[range];
  $("#pchg").innerHTML = `<span class="${up ? "up" : "down"}">${sgn(pf)}${Math.abs(pf).toFixed(2)}% (${sgn(fin - base)}${usd.format(Math.abs(fin - base))})</span> <small>${nomb}${range === "1D" ? " vs. cierre anterior" : ""}</small>`;
  const css = getComputedStyle(document.documentElement);
  const col = css.getPropertyValue(up ? "--up" : "--down").trim(), ink = css.getPropertyValue("--muted").trim(), grid = css.getPropertyValue("--line").trim();
  const x = s.t.map(fechaCR), intraday = ["1D", "5D", "1M"].includes(range);
  const traces = [{ x, y: s.c, type: "scatter", mode: "lines", line: { color: col, width: 2 }, fill: "tozeroy", fillcolor: col + "22",
    customdata: s.t.map((ms, i) => [etiqueta(ms, intraday), `${sgn(pct(s.c[i]))}${Math.abs(pct(s.c[i])).toFixed(2)}%`]), hovertemplate: `%{customdata[0]}<br><b>%{customdata[1]}</b>  ·  %{y:,.2f}<extra></extra>` }];
  if (range === "1D" && s.base) traces.push({ x: [x[0], x[x.length - 1]], y: [s.base, s.base], mode: "lines", line: { color: ink, width: 1, dash: "dot" }, hoverinfo: "skip" });
  const lo = Math.min(...s.c, base), hi = Math.max(...s.c, base), pad = (hi - lo) * 0.08 || 1;
  Plotly.react(el, traces, {
    margin: { l: 44, r: 8, t: 6, b: 28 }, showlegend: false, paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { family: "Roboto Flex, Roboto, sans-serif", color: ink, size: 11 }, hovermode: "closest", hoverdistance: -1, spikedistance: -1, dragmode: false,
    xaxis: { showgrid: false, tickformat: range === "1D" ? "%I:%M %p" : intraday ? "%d %b" : range === "5Y" ? "%Y" : "%b %Y", nticks: 5, fixedrange: true, showspikes: true, spikemode: "across", spikethickness: 1, spikecolor: ink, spikedash: "dot" },
    yaxis: { range: [lo - pad, hi + pad], gridcolor: grid, tickformat: ",.0f", nticks: 5, fixedrange: true, zeroline: false },
    hoverlabel: { bgcolor: css.getPropertyValue("--card").trim(), bordercolor: grid, font: { color: css.getPropertyValue("--ink").trim(), size: 13 } },
  }, { displayModeBar: false, responsive: true, locale: "es" });
}

function render() {
  $("#stamp").textContent = stamp;
  $("#v-fx").hidden = view !== "fx"; $("#v-spx").hidden = view !== "spx";
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.v === view ? "page" : "false"));
  if (view === "fx") renderFX(); else renderSPX();
}

// ---------- eventos ----------
$("#refresh").addEventListener("click", actualizar);
$("#usd").addEventListener("input", renderFX);
$("#ord").addEventListener("click", () => { ordenando = !ordenando; const b = $("#ord"); b.setAttribute("aria-pressed", ordenando); b.textContent = ordenando ? "✓ Listo" : "↕ Ordenar"; renderFX(); });
document.addEventListener("click", (e) => {
  const n = e.target.closest("nav button"); if (n) { view = n.dataset.v; render(); window.scrollTo(0, 0); return; }
  const mv = e.target.closest("[data-mv]"); if (mv) { mover(mv.dataset.mv, +mv.dataset.d); return; }
  const hh = e.target.closest("[data-hist]"); if (hh) { const id = hh.dataset.hist; abiertas.has(id) ? abiertas.delete(id) : abiertas.add(id); renderFX(); return; }
  const r = e.target.closest("[data-r]"); if (r) { range = r.dataset.r; document.querySelectorAll("[data-r]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.r === range)); plot(); }
});
document.addEventListener("keydown", (e) => { const h = e.target.closest && e.target.closest("[data-hist]"); if (h && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); h.click(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => view === "spx" && SPX && SPX.ok && plot());

// Al abrir: muestra lo último consultado y hace una sola consulta.
try { const s = JSON.parse(localStorage.getItem("mercados-cr") || "null"); if (s) ({ FX, SPX, stamp } = s); } catch (e) {}
render();
actualizar();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
